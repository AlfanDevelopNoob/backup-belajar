<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>border radius</title>
        <style>
            div {
                width: 300px;
                height: 300px;
                background-color: red;
                border-radius: 150px;
                
                text-align: center;
                line-height: 300px;
                overflow: hidden;
                }

            img {
                width: 300px;
            }    
        </style>
</head>
<body>
    <div>
        <img src="100px.png" alt="">
    </div>
</body>
</html>
