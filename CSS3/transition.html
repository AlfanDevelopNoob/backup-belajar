<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transtiton</title>
        <style>
            .container {
                width: 900px;
                margin: 10px auto;
                border: 5px solid black;
            }
            body {
                margin: 0;
                padding: 0;
            }
            .kotak {
                width: 100px;
                height: 100px;
                background-color: brown;
                transition: 3s 2s;
            }
            .container:hover .kotak {
                transform: rotate(180eg);
                margin-left: 800px;
                background-color: blue;
            }



            /*value transition
            property
            durasi
            fungsi
            delay*/
        </style>
</head>
<body>
    <div class="container">
        <div class="kotak"></div>
    </div>
</body>
</html>
