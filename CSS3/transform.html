<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
        <style>
            p {
                font-size: 20px;
                text-align: center;
            }
            /*value transform
            scale(angka),scaleX(angka),scaleY(angka)
            rotate(deg),rotateX(angka),rotateY(angka)
            skew(deg),skewX(deg),skewY(deg)
            translate(px),translateX(px),translateY(px)*/

            .kotak {
                width: 200px;
                height: 200px;
                background-color: lightblue;
                margin: auto;
            }
            .kotak:hover {
                transform: translate(50px,100px);
                transition: 1s;
            }
        </style>
</head>
<body>
    <div class="kotak"></div>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vel ipsam ea eligendi, explicabo iure, magnam quisquam nobis, nulla accusamus officiis quia delectus pariatur deserunt repellat alias velit cupiditate ad impedit.</p>
</body>
</html>
